map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https on;
}

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    server_tokens off;
    client_max_body_size 64M;
    add_header X-Content-Type-Options nosniff always;

    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/(application|vendor|docker|docs|scripts)(/|$) { deny all; }
    location ~* ^/(banco\.sql|composer\.(json|lock)|.*\.(yml|yaml|md|txt|ini|log|bak))$ { deny all; }
    location ^~ /install/ { deny all; }
    location ~* ^/assets/.*\.(php[0-9]*|phtml|phar|pht|phps)(/|$) { deny all; }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }
    location ~ \.php(?:/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 120;
    }
}
