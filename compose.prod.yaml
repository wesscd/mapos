name: mapos
services:
  php:
    build: ./docker/runtime
    volumes:
      - .:/var/www/html
      - communication_private:/var/lib/mapos-communication
    secrets:
      - whatsapp_token
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  whatsapp:
    build: ./services/whatsapp
    volumes:
      - whatsapp_data:/data
    secrets:
      - whatsapp_token
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  communication-worker:
    build: ./docker/runtime
    command: [sh, -c, 'while true; do php index.php comunicacao_worker process; sleep 15; done']
    volumes:
      - .:/var/www/html
      - communication_private:/var/lib/mapos-communication
    secrets:
      - whatsapp_token
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine
    volumes:
      - .:/var/www/html:ro
      - ./docker/runtime/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
      proxy:
        aliases:
          - mapos-web
    depends_on:
      - php
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mapos
      MYSQL_USER: mapos
      MYSQL_PASSWORD: ${MAPOS_DB_PASSWORD:?Set MAPOS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MAPOS_DB_ROOT_PASSWORD:?Set MAPOS_DB_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
volumes:
  db:
  whatsapp_data:
  communication_private:
secrets:
  whatsapp_token:
    file: ./.secrets/whatsapp-token
networks:
  proxy:
    external: true
    name: ${MAPOS_PROXY_NETWORK:?Set MAPOS_PROXY_NETWORK}
