name: mapos
services:
  php:
    build: ./docker/runtime
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine
    volumes:
      - .:/var/www/html:ro
      - ./docker/runtime/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
      proxy:
        aliases:
          - mapos-web
    depends_on:
      - php
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mapos
      MYSQL_USER: mapos
      MYSQL_PASSWORD: ${MAPOS_DB_PASSWORD:?Set MAPOS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MAPOS_DB_ROOT_PASSWORD:?Set MAPOS_DB_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
volumes:
  db:
networks:
  proxy:
    external: true
    name: ${MAPOS_PROXY_NETWORK:?Set MAPOS_PROXY_NETWORK}
